spring:
  application:
    name: fleetos-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fleetos}
    username: ${SPRING_DATASOURCE_USERNAME:fleetos}
    password: ${SPRING_DATASOURCE_PASSWORD:fleetos}
    driver-class-name: org.postgresql.Driver
  jpa:
    # Schema is owned by Flyway migrations — Hibernate must never alter it.
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  jwt:
    # DEV-ONLY default. Set JWT_SECRET to a long random string in production.
    secret: ${JWT_SECRET:dev-only-change-me-in-production-use-a-long-random-secret-0123456789abcdef}
    expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health
