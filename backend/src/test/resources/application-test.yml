# Test profile: H2 in-memory database (no Postgres needed for unit/integration tests).
spring:
  datasource:
    url: jdbc:h2:mem:fleetos-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  sql:
    init:
      mode: never

app:
  jwt:
    secret: test-only-secret-for-integration-tests-0123456789abcdef0123456789abcdef
    expiration-ms: 3600000
